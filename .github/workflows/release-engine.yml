name: Release Engine

# Creates an engine release whenever a version tag is pushed.
#
# Stable release example:
#   git tag v0.1.0
#   git push origin v0.1.0
#
# Development release example:
#   git tag v0.1.0-beta1
#   git push origin v0.1.0-beta1

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"

permissions:
  contents: write

concurrency:
  group: release-engine-${{ github.ref_name }}
  cancel-in-progress: false

env:
  MANIFEST_BRANCH: main
  MANIFEST_PATH: versions.json

jobs:
  build-windows-x64:
    runs-on: windows-latest

    steps:
      # ImGui, Tracy and ImGuiColorTextEdit are Git submodules, so they must
      # also be downloaded.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Derive version and channel
        id: version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"

          if [[ "$VERSION" == *-* ]]; then
            CHANNEL="development"
          else
            CHANNEL="stable"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

          echo "Publishing Tilky Engine $VERSION"
          echo "Channel: $CHANNEL"

      - name: Check that release does not already exist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view "${GITHUB_REF_NAME}" \
            --repo "${{ github.repository }}" >/dev/null 2>&1; then

            echo "::error::A GitHub Release already exists for tag ${GITHUB_REF_NAME}."
            echo "::error::Delete the existing release and tag, or publish a new version."
            exit 1
          fi

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            https://github.com/microsoft/vcpkg.git \
            "${{ github.workspace }}/vcpkg"

          "${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh" \
            -disableMetrics

      - name: Configure CMake
        shell: bash
        run: |
          set -euo pipefail

          cmake -B build -S . \
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build engine
        shell: bash
        run: |
          set -euo pipefail

          cmake --build build \
            --config Release \
            --target Tilky_All \
            --parallel

      - name: Package versioned ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"

          BUILD_DIR="build"
          BIN_DIR="$BUILD_DIR/Release"
          STAGE_DIR="stage"
          ZIP_NAME="Tilky_Engine-Windows-x64-${VERSION}.zip"

          rm -rf "$STAGE_DIR"
          rm -f "$ZIP_NAME"

          mkdir -p "$STAGE_DIR"

          if [ ! -f "$BIN_DIR/Tilky_Engine.exe" ]; then
            echo "::error::Missing $BIN_DIR/Tilky_Engine.exe"
            exit 1
          fi

          if [ ! -f "$BIN_DIR/Standalone.exe" ]; then
            echo "::error::Missing $BIN_DIR/Standalone.exe"
            exit 1
          fi

          cp "$BIN_DIR/Tilky_Engine.exe" "$STAGE_DIR/"
          cp "$BIN_DIR/Standalone.exe" "$STAGE_DIR/"

          # Runtime DLLs are copied beside the executables by CMake.
          shopt -s nullglob
          DLLS=("$BIN_DIR"/*.dll)

          if [ ${#DLLS[@]} -gt 0 ]; then
            cp "${DLLS[@]}" "$STAGE_DIR/"
          fi

          # Runtime assets are copied to the build-directory root.
          # Keep this list synchronized with TILKY_RUNTIME_ASSET_DIRS
          # in CMakeLists.txt.
          for DIR in \
            EngineAssets \
            LauncherAssets \
            Shaders \
            Fonts \
            Textures
          do
            if [ -d "$BUILD_DIR/$DIR" ]; then
              cp -r "$BUILD_DIR/$DIR" "$STAGE_DIR/$DIR"
            fi
          done

          if [ ! -f "$STAGE_DIR/Tilky_Engine.exe" ]; then
            echo "::error::Tilky_Engine.exe was not staged."
            exit 1
          fi

          if [ ! -f "$STAGE_DIR/Standalone.exe" ]; then
            echo "::error::Standalone.exe was not staged."
            exit 1
          fi

          (
            cd "$STAGE_DIR"
            7z a -tzip "../${ZIP_NAME}" . >/dev/null
          )

          if [ ! -f "$ZIP_NAME" ]; then
            echo "::error::Failed to create ${ZIP_NAME}."
            exit 1
          fi

          SHA256="$(sha256sum "$ZIP_NAME" | cut -d ' ' -f1)"
          SIZE="$(stat -c%s "$ZIP_NAME")"

          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"

          echo "Created $ZIP_NAME"
          echo "Size: $SIZE bytes"
          echo "SHA-256: $SHA256"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          PRERELEASE_ARGS=()

          if [ "${{ steps.version.outputs.channel }}" = "development" ]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            "${{ steps.package.outputs.zip_name }}" \
            --repo "${{ github.repository }}" \
            --title "Tilky Engine ${{ steps.version.outputs.version }}" \
            --notes "Automated Tilky Engine release.

          Version: ${{ steps.version.outputs.version }}
          Platform: windows-x64
          Channel: ${{ steps.version.outputs.channel }}" \
            "${PRERELEASE_ARGS[@]}"

      - name: Update versions.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git fetch origin "${MANIFEST_BRANCH}"
          git checkout "${MANIFEST_BRANCH}"
          git pull --ff-only origin "${MANIFEST_BRANCH}"

          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ steps.version.outputs.channel }}"
          ZIP_NAME="${{ steps.package.outputs.zip_name }}"
          SHA256="${{ steps.package.outputs.sha256 }}"
          SIZE="${{ steps.package.outputs.size }}"

          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}/${ZIP_NAME}"

          if [ ! -f "${MANIFEST_PATH}" ]; then
            echo '{"manifestVersion":1,"versions":[]}' > "${MANIFEST_PATH}"
          fi

          jq \
            --arg version "$VERSION" \
            --arg platform "windows-x64" \
            --arg channel "$CHANNEL" \
            --arg url "$DOWNLOAD_URL" \
            --argjson size "$SIZE" \
            --arg sha256 "$SHA256" \
            '
              .manifestVersion = 1
              | .versions = (
                  [
                    .versions[]
                    | select(
                        .version != $version
                        or .platform != $platform
                      )
                  ]
                  + [
                      {
                        version: $version,
                        platform: $platform,
                        channel: $channel,
                        downloadUrl: $url,
                        size: $size,
                        sha256: $sha256
                      }
                    ]
                )
            ' \
            "${MANIFEST_PATH}" > "${MANIFEST_PATH}.tmp"

          mv "${MANIFEST_PATH}.tmp" "${MANIFEST_PATH}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${MANIFEST_PATH}"

          if git diff --cached --quiet; then
            echo "versions.json is already up to date."
          else
            git commit \
              -m "Add engine version ${VERSION} (${CHANNEL}) to versions.json [skip ci]"

            git push origin "HEAD:${MANIFEST_BRANCH}"
          fi